# HỆ THỐNG QUẢN LÝ CHUNG CƯ DWELL - ĐỀ TÀI 36 (TKQT HTPM K23)
# Tác giả: Nguyễn Thị Trang (NTrang206)
# Giai đoạn 2: Tích hợp Hệ thống Giám sát Hiệu năng (Prometheus + Grafana + Exporters)
# ==============================================================================

name: tkqt-chungcu-de36

services:
  # ----------------------------------------------------------------------------
  # 1. NGINX REVERSE PROXY CONTAINER (Cổng đón duy nhất)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: chungcu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
      pgadmin:
        condition: service_started
      grafana:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 2. WEB APPLICATION BACKEND CONTAINER (FastAPI Non-Root)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chungcu-backend:latest
    container_name: chungcu_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PROJECT_NAME=${PROJECT_NAME}
      - VERSION=${VERSION}
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. POSTGRESQL 16 DATABASE CONTAINER (Cô lập mạng an toàn, không mở port ra host)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chungcu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. PGADMIN 4 CONTAINER (Giao diện Quản trị CSDL)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chungcu_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend_net
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. PROMETHEUS CONTAINER (Giám sát Metrics)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: chungcu_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_net
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. GRAFANA CONTAINER (Dashboard Trực quan hóa)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: chungcu_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring_net
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - prometheus

  # ----------------------------------------------------------------------------
  # 7. CADVISOR CONTAINER (Giám sát Tài nguyên Container CPU / RAM)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: chungcu_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M

  # ----------------------------------------------------------------------------
  # 8. POSTGRES EXPORTER CONTAINER (Metrics Chuyên sâu CSDL)
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: chungcu_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
