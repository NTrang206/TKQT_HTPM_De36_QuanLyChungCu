# Giai đoạn 1: Core Web App + PostgreSQL + pgAdmin + Nginx Reverse Proxy (SSL)
# ==============================================================================

name: tkqt-chungcu-de36

services:
  # ----------------------------------------------------------------------------
  # 1. NGINX REVERSE PROXY CONTAINER (Cổng đón duy nhất)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: chungcu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
      pgadmin:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 2. WEB APPLICATION BACKEND CONTAINER (FastAPI Non-Root)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chungcu-backend:latest
    container_name: chungcu_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PROJECT_NAME=${PROJECT_NAME}
      - VERSION=${VERSION}
    networks:
      - frontend_net
      - backend_net
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. POSTGRESQL 16 DATABASE CONTAINER (Cô lập mạng an toàn, không mở port ra host)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chungcu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. PGADMIN 4 CONTAINER (Giao diện Quản trị CSDL)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chungcu_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend_net
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
